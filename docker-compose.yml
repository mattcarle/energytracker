services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      # Caddy terminates TLS in front of this service - it only ever talks plain HTTP over the
      # Docker network, so the prod profile's own keystore-based HTTPS is turned off here.
      SERVER_SSL_ENABLED: "false"
      # Explicit path instead of the prod profile's default "~/h2db/..." - ~ would expand
      # relative to whatever user the JVM runs as, which is fragile inside a container.
      # DB_CLOSE_DELAY=-1 keeps the embedded DB open for the JVM's life - without it, H2
      # shuts the database down the instant its last pooled connection closes (e.g. when
      # HikariCP's default 30-minute maxLifetime retires an idle connection), and the next
      # request fails with "The database has been closed".
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/energytracker-prod;DB_CLOSE_DELAY=-1
    volumes:
      - h2-data:/data
    expose:
      - "8080"
    # Caps the container at 4GB so it can be tested under the kind of memory ceiling a small
    # cloud instance would impose - the JVM detects this cgroup limit automatically (Java 10+
    # container support) and sizes its default max heap as a fraction of it, rather than the
    # host machine's full RAM.
    mem_limit: 4g

  caddy:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - "80"
    networks:
      # Needed to reach `app` - listing any network here drops compose's implicit default, so it's
      # named explicitly alongside the shared one below.
      default: {}
      # The carle7-edge reverse proxy (see that repo) reaches this container by the alias below -
      # bring that stack up first, since this network is only created there.
      carle7-edge:
        aliases:
          - energytracker

  # A second, independent instance of this same app (separate database, separate Octopus account/
  # credentials entered via its own setup wizard) sharing the domain at /energytracker2 - see
  # frontend/Caddyfile and carle7-edge's own Caddyfile for how the path prefix is wired up. Only
  # the path prefix/upstream name and the DB file differ from `app`/`caddy` above; add app3/caddy3
  # the same way for a third instance.
  app2:
    build:
      context: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SERVER_SSL_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/energytracker2-prod;DB_CLOSE_DELAY=-1
      # Scopes this instance's session/CSRF cookies to /energytracker2 (see SecurityConfig) so
      # they don't collide with the primary instance's cookies on the same domain.
      APP_BASE_PATH: /energytracker2
    volumes:
      - h2-data-2:/data
    expose:
      - "8080"
    mem_limit: 4g

  caddy2:
    build:
      context: ./frontend
      args:
        APP_BASE_PATH: /energytracker2/
    restart: unless-stopped
    depends_on:
      - app2
    environment:
      APP_PATH: /energytracker2
      APP_UPSTREAM: app2
    expose:
      - "80"
    networks:
      default: {}
      carle7-edge:
        aliases:
          - energytracker2

networks:
  carle7-edge:
    external: true

volumes:
  h2-data:
  h2-data-2:
