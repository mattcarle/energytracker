# Dev profile - local development defaults. Plain HTTP, and the diagnostic/dev tooling
# (H2 console, Swagger UI) left on since this profile is never meant to be reachable from
# outside the developer's own machine.

spring.datasource.url=jdbc:h2:file:~/h2db/energytracker;DB_CLOSE_DELAY=-1

# Skip the startup usage load - speeds up dev restarts, and the data already in the local H2
# file is enough to work against. Fetch on demand instead: Admin > Manage Data.
app.startup-usage-load.enabled=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.show-actuator=false
