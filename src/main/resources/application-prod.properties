# Prod profile - a separate database file from dev (never share state across environments),
# HTTPS required, and the dev-only diagnostic tooling (H2 console, Swagger UI) turned off since
# neither should ever be reachable outside a developer's own machine.

spring.datasource.url=jdbc:h2:file:~/h2db/energytracker-prod;DB_CLOSE_DELAY=-1

# H2 Console - disabled; never expose a raw SQL console on a production deployment
spring.h2.console.enabled=false

# Swagger/OpenAPI - disabled; don't expose the API schema/UI publicly
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# --- SSL/TLS (HTTPS) ---
# Placeholder values - replace before deploying, or override via environment variables
# (e.g. SERVER_SSL_KEY_STORE_PASSWORD) instead of editing this file directly. See README.md,
# "Running in production", for how to generate/install a keystore.
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:${user.home}/keystore/energytracker/keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=energytracker
