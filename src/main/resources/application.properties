spring.application.name=energytracker

# Which profile's properties (application-{profile}.properties) apply - "dev" by default so
# plain `mvnw spring-boot:run` works locally out of the box. Override for a real deployment
# with SPRING_PROFILES_ACTIVE=prod (env var) or -Dspring.profiles.active=prod (JVM arg); either
# takes precedence over this default. See README.md for what each profile changes.
spring.profiles.active=dev

# Whether the app pulls the latest Octopus usage on startup (see DataLoadScheduler) - on by
# default so a real deployment always starts caught up; dev overrides this off so restarts
# during development aren't held up by an API round-trip nothing there needs.
app.startup-usage-load.enabled=true

# The path prefix this instance is served under behind the shared reverse proxy (e.g.
# /energytracker, or /energytracker2 for a second instance of this same app sharing the domain -
# see docker-compose.yml/frontend/Caddyfile). Session and CSRF cookies are scoped to it (see
# SecurityConfig) so two instances on the same domain don't clobber each other's cookies despite
# the backend itself only ever seeing bare /api/... paths (the proxy strips the prefix first).
app.base-path=${APP_BASE_PATH:/energytracker}
server.servlet.session.cookie.path=${app.base-path}

# H2 Database Configuration - properties common to every profile; the JDBC URL itself is
# profile-specific (see application-dev.properties / application-prod.properties) so dev and
# prod never read or write the same database file.
spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.generate_statistics=true
# Bind/read JDBC timestamps in a fixed zone regardless of the JVM's default zone, so DST
# transitions (e.g. UK clocks springing forward) can't collapse two distinct LocalDateTime
# values that fall in the local "skipped hour" into the same stored TIMESTAMP.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
