spring.application.name=energytracker

# Which profile's properties (application-{profile}.properties) apply - "dev" by default so
# plain `mvnw spring-boot:run` works locally out of the box. Override for a real deployment
# with SPRING_PROFILES_ACTIVE=prod (env var) or -Dspring.profiles.active=prod (JVM arg); either
# takes precedence over this default. See README.md for what each profile changes.
spring.profiles.active=dev

# H2 Database Configuration - properties common to every profile; the JDBC URL itself is
# profile-specific (see application-dev.properties / application-prod.properties) so dev and
# prod never read or write the same database file.
spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.generate_statistics=true
# Bind/read JDBC timestamps in a fixed zone regardless of the JVM's default zone, so DST
# transitions (e.g. UK clocks springing forward) can't collapse two distinct LocalDateTime
# values that fall in the local "skipped hour" into the same stored TIMESTAMP.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
