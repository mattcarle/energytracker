# Growatt OpenAPI v1 configuration
growatt.api.base-url=https://openapi.growatt.com/v1

# Time zone Growatt's dates/times are in - used to work out "today" for Growatt calls. The JVM
# default zone is UTC (see EnergyTrackerApplication), so this must not be left to LocalDate.now().
growatt.api.time-zone=Europe/London
