spring.application.name=energytracker

# SecurityConfig requires this with no default (${app.base-path}) - main's application.properties
# supplies it via APP_BASE_PATH, but this file fully replaces (not layers onto) that one for
# tests, so it has to be set here too or context loading fails with an unresolved placeholder.
app.base-path=/

# H2 In-Memory Database for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
